<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Proposed typography (en)</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="typography.css">
</head>
<body>
  <div id="header">
    <div class="header_inner">
      <div id="logo">
        <a href="#" title="Home"><img src="zendesk_logo.svg" alt="Logo" width="109" height="30"></a>
      </div>
    </div>
  </div>

  <div id="wrap">
    <div id="oauth">
      <div class="content content_green">
        <div id="client-logo">
          <div id="client-logo-wrapper">
            <img src="client-logo.svg" alt="" />
          </div>
        </div>
        <div id="authorization">
          <div id="client-description">
            <span>Acme Helpdesk Sync</span><br />
            <span>by Acme Inc.</span>
          </div>
          <div id="client-name">
            <h4>Allow Acme Helpdesk Sync to access your Zendesk account?</h4>
            <p>Keeps tickets, users and organizations in sync between Acme Helpdesk and your Zendesk account.</p>
          </div>

          <div id="scopes">
            <p>This application would be able to:</p>
            <ul>
              <li>Read all data.</li>
            </ul>
          </div>

          <div id="user-actions">
            <div id="user-approval">
              <form class="deny"><input type="submit" value="Deny"></form>
              <form class="approve"><input type="submit" value="Allow"></form>
            </div>
            <p id="user-logout">Not <a href="#">jane.doe@example.com</a>?</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
